[project]
name = "m2s"
version = "0.1.0"
description = "music2sheet: audio to sheet music (AI draft + human fine-tuning)"
requires-python = "==3.11.*"
dependencies = [
  "numpy",
  "pydantic>=2",
  "pydantic-settings",
  "soundfile",
  "pretty-midi",
  "mido",
  "music21>=10",
  "partitura",
  "torch",
  "torchaudio",
  "transkun",
  "beat-this",
  "setuptools<81",
  "psutil",
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
  "typer",
  "lxml",
]

[project.optional-dependencies]
youtube = ["yt-dlp[default]"]
eval = ["mir_eval", "remotezip"]

[project.scripts]
m2s = "m2s.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/m2s"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "playwright>=1.63.0",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"  # run the slow ASAP regression/svsep tests with: pytest -m slow
markers = ["slow: long-running regression tests", "svsep: needs the piano_svsep environment"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "B905"]  # typer calls in defaults; zip strict noise
